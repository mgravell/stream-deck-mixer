# Virtual mixer channels, BridgeCast-style.
# Each loopback creates a virtual sink (the "channel") whose output is wired
# to the Sound Blaster G3. Per-channel volume = channel fader; G3 volume = master.
#
# node.dont-reconnect = true keeps a channel from falling back to another
# output (or looping into itself) if the G3 is unplugged - it just goes silent.
#
# To add a channel: copy a block, change node.description and the two node.name
# values (names must be unique, no spaces), then:
#   systemctl --user restart pipewire pipewire-pulse wireplumber

context.modules = [
    { name = libpipewire-module-loopback
        args = {
            node.description = "Game"
            capture.props = {
                node.name        = "game_channel"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "game_channel.out"
                node.description = "Game -> G3"
                target.object    = "alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_G3_CC08F2F2C2F3E386-03.analog-stereo"
                node.dont-reconnect = true
                node.passive     = true
                stream.dont-remix = true
            }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Media"
            capture.props = {
                node.name        = "media_channel"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "media_channel.out"
                node.description = "Media -> G3"
                target.object    = "alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_G3_CC08F2F2C2F3E386-03.analog-stereo"
                node.dont-reconnect = true
                node.passive     = true
                stream.dont-remix = true
            }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Chat"
            capture.props = {
                node.name        = "chat_channel"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "chat_channel.out"
                node.description = "Chat -> G3"
                target.object    = "alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_G3_CC08F2F2C2F3E386-03.analog-stereo"
                node.dont-reconnect = true
                node.passive     = true
                stream.dont-remix = true
            }
        }
    }
]
